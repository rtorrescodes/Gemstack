name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish Package to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Security Gate - Run CI All
        run: npm run ci:all

      - name: Pack Package
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Publish to NPM
        run: npm publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify NPM Availability
        run: |
          echo "Waiting for NPM registry to reflect publication..."
          TARGET_VERSION="${{ github.ref_name }}"
          TARGET_VERSION="${TARGET_VERSION#v}"
          for i in {1..30}; do
            LATEST=$(npm view gemstack-ai version 2>/dev/null || echo "")
            echo "Current latest on npm: $LATEST (target: $TARGET_VERSION)"
            if [ "$LATEST" = "$TARGET_VERSION" ]; then
              echo "Successfully verified on npm: gemstack-ai@$TARGET_VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "Error: NPM registry did not reflect target version $TARGET_VERSION within timeout."
          exit 1

  release-github:
    name: Create GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # Granted strictly to GitHub release creation

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Pack Tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "${{ env.TARBALL }}"
