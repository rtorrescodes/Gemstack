name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Requerido para crear GitHub Releases

jobs:
  publish:
    name: Publish to NPM and GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Security Gate - Run CI All
        run: npm run ci:all

      - name: Pack Package
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Publish to NPM
        run: npm publish "$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "$TARBALL"

      - name: Verify NPM Availability
        run: |
          echo "Waiting for NPM registry to reflect publication..."
          TARGET_VERSION="${{ github.ref_name }}"
          TARGET_VERSION="${TARGET_VERSION#v}"
          for i in {1..30}; do
            LATEST=$(npm view gemstack-ai version 2>/dev/null || echo "")
            echo "Current latest on npm: $LATEST (target: $TARGET_VERSION)"
            if [ "$LATEST" = "$TARGET_VERSION" ]; then
              echo "Successfully verified on npm: gemstack-ai@$TARGET_VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "Notice: npm publish completed; edge CDN still replicating."

