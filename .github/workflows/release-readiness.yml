name: Release Readiness

on:
  workflow_dispatch:

jobs:
  validate-and-pack:
    name: Validate and Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: npm install
      - name: Run Native Tests
        run: npm test
      - name: Run CI Suite
        run: npm run ci:all
      - name: Run Demo Smoke
        run: npm run ci:demo
      - name: Pack NPM Tarball
        run: npm pack
      - name: Test Tarball in Dummy Project
        run: |
          mkdir ../gemstack-dummy
          cd ../gemstack-dummy
          npm init -y
          npm install ../Gemstack/gemstack-*.tgz
          npx gemstack --help
          npx gemstack init --dry-run
          npx gemstack init --yes
          npx gemstack doctor
          npx gemstack update --dry-run
      - name: Upload NPM Tarball
        uses: actions/upload-artifact@v4
        with:
          name: gemstack-npm-tarball
          path: gemstack-*.tgz
          if-no-files-found: error
