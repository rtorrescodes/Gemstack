name: Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-pack:
    name: Validate and Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x
      - name: Install Dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Run Native Tests
        run: npm test
      - name: Run CI Suite
        run: npm run ci:all
      - name: Run Demo Smoke
        run: npm run ci:demo
      - name: Pack NPM Tarball
        run: npm pack
      - name: Test Tarball in Dummy Project
        run: |
          mkdir ../gemstack-dummy
          cd ../gemstack-dummy
          npm init -y
          npm install ../Gemstack/gemstack-*.tgz
          npx gemstack --help
          npx gemstack init --dry-run
          npx gemstack init --yes
          npx gemstack doctor
          npx gemstack update --dry-run
      - name: Upload NPM Tarball
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: gemstack-npm-tarball
          path: gemstack-*.tgz
          if-no-files-found: error
